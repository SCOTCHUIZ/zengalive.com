      background: #121212;

      padding-bottom: 120px;

      display: flex;

      background: #0a0a0a;

      align-items: center;
      justify-content: center;

      margin: 24px 0 10px;

      letter-spacing: 1.5px;
      color: #888;
      border-bottom: 1px solid #333;
      padding-bottom: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
    }

    .sound-btn {
      aspect-ratio: 1;
      border: none;
      border-radius: 16px;
      font-size: 0.65rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      line-height: 1.3;
      transition: transform 0.1s, filter 0.15s;
      word-break: break-word;
    }

    .sound-btn:active { transform: scale(0.95); filter: brightness(1.3); }

    .blue   { background: #1565c0; color: #fff; }
    .green  { background: #2e7d32; color: #fff; }
    .purple { background: #6a1b9a; color: #fff; }
    .orange { background: #e65100; color: #fff; }
    .teal   { background: #00695c; color: #fff; }
    .pink   { background: #880e4f; color: #fff; }

    /* Add Sound Panel */

      border-radius: 8px;

    #add-panel {

      background: #2a2a2a;

      border-radius: 8px;

      padding: 8px 10px;

      width: 100%;

    #add-form .row { display: flex; gap: 8px; }

    #add-form .row button {

      border-radius: 8px;

    .tab-row { display: flex; gap: 8px; }

    #url-section, #file-section { display: none; }

  <!-- Manage Panel -->

      <h3>Manage Sounds</h3>
      <button id="manage-close" onclick="closeManage()">Close</button>
    </div>
    <button id="add-btn" onclick="openAddForm()">+ Add Sound</button>
    <div id="manage-list"></div>
  </div>

  <!-- Add Sound Form (inside manage) -->
  <div id="add-panel">
    <div id="add-form">
      <h3>Add Sound</h3>
      <div class="tab-row">
        <div class="tab active" id="tab-url" onclick="switchTab('url')">URL</div>
        <div class="tab" id="tab-file" onclick="switchTab('file')">Upload MP3</div>
      </div>
      <div id="url-section" class="active">
        <input type="text" id="sound-url" placeholder="Sound URL" />
      </div>
      <div id="file-section">
        <input type="file" id="sound-file" accept=".mp3,audio/*" />
        <div id="upload-progress"><div id="upload-progress-bar"></div></div>
      </div>
      <input type="text" id="sound-label" placeholder="Label (e.g. Cowbell)" />
      <select id="sound-category">
        <option value="themes">Theme Songs</option>
        <option value="tv">TV & Movies</option>
        <option value="reactions">Reactions</option>
        <option value="sfx">Sound Effects</option>
        <option value="quotes">Quotes</option>
      </select>
      <div id="add-status"></div>
      <div class="row">
        <button id="save-sound-btn" onclick="saveSound()">Save</button>
        <button id="cancel-btn" onclick="closePanel()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="edit-modal">
    <div id="edit-form">
      <h3>Edit Sound</h3>
      <input type="text" id="edit-label" placeholder="Label" />
      <input type="text" id="edit-url" placeholder="Sound URL" />
      <select id="edit-category">
        <option value="themes">Theme Songs</option>
        <option value="tv">TV & Movies</option>
        <option value="reactions">Reactions</option>
        <option value="sfx">Sound Effects</option>
        <option value="quotes">Quotes</option>
      </select>
      <div class="inout-row">
        <input type="number" id="edit-timein" placeholder="In (sec)" step="0.1" min="0" />
        <input type="number" id="edit-timeout" placeholder="Out (sec)" step="0.1" min="0" />
      </div>
      <div id="edit-status"></div>
      <div class="row">
        <button id="edit-save-btn" onclick="saveEdit()">Save</button>
        <button id="edit-cancel-btn" onclick="closeEdit()">Cancel</button>
      </div>
    </div>
  </div>

        { label: "Taco Bell", url: "https://cdn.blerp.com/normalized/ab8299c0-91d4-11ec-8583-dfca0b055182" },
        { label: "Yakety Sax", url: "https://cdn.blerp.com/normalized/74574640-9331-11ec-82ba-4b0b0588e63e" },
        { label: "Batman '66", url: "https://cdn.blerp.com/normalized/a755fa40-976a-11ec-917b-7989fd768a45" },
        { label: "Rimshot", url: "https://cdn.pixabay.com/audio/2022/03/15/audio_2c1cb36319.mp3" }
      ],

        { label: "Trump Thank You", url: "https://www.myinstants.com/media/sounds/thank-you-very-much-trump.mp3" },
        { label: "Don't Be Rude", url: "https://www.myinstants.com/media/sounds/trump-dont-be-rude.mp3" },
        { label: "I Don't Think So", url: "https://www.myinstants.com/media/sounds/hiatim.mp3" },
      ]
    };

    // --- Audio setup ---
    const colorMap = ["blue","green","purple","orange","teal","pink"];
    let current = null;
    let currentSource = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.value = -24;
    compressor.knee.value = 12;
    compressor.ratio.value = 8;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.15;
    const gainNode = audioCtx.createGain();
    gainNode.gain.value = 0.8;
    compressor.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    function playSound(url, timeIn, timeOut) {
      if (current) { current.pause(); current.currentTime = 0; }
      if (currentSource) { try { currentSource.disconnect(); } catch(e){} }
      if (audioCtx.state === "suspended") audioCtx.resume();
      current = new Audio(url);
      current.crossOrigin = "anonymous";
      if (timeIn) current.currentTime = timeIn;
      if (timeOut) {
        current.addEventListener("timeupdate", function() {
          if (current.currentTime >= timeOut) { current.pause(); current.currentTime = timeIn || 0; }
        });
      }
      current.play().then(() => {
        try {
          currentSource = audioCtx.createMediaElementSource(current);
          currentSource.connect(compressor);
        } catch(e) { current.volume = 0.6; }
      }).catch(() => {
        current = new Audio(url);
        current.volume = 0.6;
        if (timeIn) current.currentTime = timeIn;
        current.play();
      });
    }

    // store all docs for manage panel
    let allDocs = [];

    function renderButton(s, i, container) {
      const btn = document.createElement("button");
      btn.className = "sound-btn " + colorMap[i % colorMap.length];
      btn.textContent = s.label;
      btn.onclick = () => playSound(s.url, s.timeIn || null, s.timeOut || null);
      container.appendChild(btn);
    }

    const delay = ms => new Promise(r => setTimeout(r, ms));

    async function seedIfEmpty(col) {
      const snap = await getDocs(col);
      if (!snap.empty) return;
      let order = 0;
      for (const [category, items] of Object.entries(SEED_SOUNDS)) {
        for (const item of items) {
          await addDoc(col, { ...item, category, order: order++ });
          await delay(200);
        }
      }
    }

    async function loadSounds() {
      const col = collection(db, "sounds");
      await seedIfEmpty(col);
      const snap = await getDocs(query(col, orderBy("order")));
      allDocs = [];
      snap.forEach(d => allDocs.push({ id: d.id, ...d.data() }));
      const grouped = {};
      allDocs.forEach(d => {
        if (!grouped[d.category]) grouped[d.category] = [];
        grouped[d.category].push(d);
      });
      for (const [category, items] of Object.entries(grouped)) {
        const container = document.getElementById(category);
        if (!container) continue;
        items.forEach((s, i) => renderButton(s, i, container));
      }
    }

    loadSounds();

    document.getElementById("stop-btn").onclick = () => {
      if (current) { current.pause(); current.currentTime = 0; }
      if (currentSource) { try { currentSource.disconnect(); } catch(e){} }
    };

      document.getElementById("url-section").classList.toggle("active", tab === "url");
      document.getElementById("file-section").classList.toggle("active", tab === "file");
      document.getElementById("tab-url").classList.toggle("active", tab === "url");
      document.getElementById("tab-file").classList.toggle("active", tab === "file");
    };

    window.closePanel = function() {
      document.getElementById("add-panel").classList.remove("open");
      document.getElementById("add-status").textContent = "";
      document.getElementById("sound-url").value = "";
      document.getElementById("sound-label").value = "";
      document.getElementById("sound-file").value = "";
      document.getElementById("upload-progress").style.display = "none";
      document.getElementById("upload-progress-bar").style.width = "0%";
    };

    window.openAddForm = () => document.getElementById("add-panel").classList.add("open");

    window.saveSound = async function() {
      const label = document.getElementById("sound-label").value.trim();
      const category = document.getElementById("sound-category").value;
      const status = document.getElementById("add-status");
      const isFile = document.getElementById("file-section").classList.contains("active");

      if (!label) { status.textContent = "Label is required."; return; }

      if (isFile) {
        const file = document.getElementById("sound-file").files[0];
        if (!file) { status.textContent = "Choose a file."; return; }
        status.textContent = "Uploading...";
        const storageRef = ref(storage, `sounds/${Date.now()}_${file.name}`);
        const task = uploadBytesResumable(storageRef, file);
        const progress = document.getElementById("upload-progress");
        const bar = document.getElementById("upload-progress-bar");
        progress.style.display = "block";
        task.on("state_changed",
          snap => { bar.style.width = (snap.bytesTransferred / snap.totalBytes * 100) + "%"; },
          () => { status.textContent = "Upload failed."; },
          async () => {
            const url = await getDownloadURL(task.snapshot.ref);
            await addDoc(collection(db, "sounds"), { label, url, category, order: Date.now() });
            status.textContent = "Saved!";
            renderButton({ label, url }, document.getElementById(category).children.length, document.getElementById(category));
            setTimeout(closePanel, 800);
          }
        );
      } else {
        const url = document.getElementById("sound-url").value.trim();
        if (!url) { status.textContent = "URL is required."; return; }
        await addDoc(collection(db, "sounds"), { label, url, category, order: Date.now() });
        status.textContent = "Saved!";
        renderButton({ label, url }, document.getElementById(category).children.length, document.getElementById(category));
        setTimeout(closePanel, 800);
      }
    };
    // --- Manage Panel ---
    const catLabels = { themes: "Theme Songs", tv: "TV & Movies", reactions: "Reactions", sfx: "Sound Effects", quotes: "Quotes" };

    function openManage() {
      const list = document.getElementById("manage-list");
      list.innerHTML = "";
      allDocs.forEach(s => {
        const row = document.createElement("div");
        row.className = "manage-item";
        row.innerHTML = `
          <span class="manage-item-label">${s.label}</span>
          <span class="manage-item-cat">${catLabels[s.category] || s.category}</span>
          <button class="manage-edit-btn">Edit</button>
          <button class="manage-del-btn">Del</button>
        `;
        row.querySelector(".manage-edit-btn").onclick = () => openEdit(s);
        row.querySelector(".manage-del-btn").onclick = () => deleteSound(s.id, row);
        list.appendChild(row);
      });
      document.getElementById("manage-panel").classList.add("open");
    }

    async function deleteSound(id, row) {
      if (!confirm("Delete this sound?")) return;
      await deleteDoc(doc(db, "sounds", id));
      allDocs = allDocs.filter(s => s.id !== id);
      row.remove();
    }

    window.closeManage = () => document.getElementById("manage-panel").classList.remove("open");

    // --- Edit Modal ---
    let editingId = null;

    function openEdit(s) {
      editingId = s.id;
      document.getElementById("edit-label").value = s.label;
      document.getElementById("edit-url").value = s.url;
      document.getElementById("edit-category").value = s.category;
      document.getElementById("edit-timein").value = s.timeIn != null ? s.timeIn : "";
      document.getElementById("edit-timeout").value = s.timeOut != null ? s.timeOut : "";
      document.getElementById("edit-status").textContent = "";
      document.getElementById("edit-modal").classList.add("open");
    }

    window.closeEdit = () => document.getElementById("edit-modal").classList.remove("open");

    window.saveEdit = async function() {
      const status = document.getElementById("edit-status");
      const label = document.getElementById("edit-label").value.trim();
      const url = document.getElementById("edit-url").value.trim();
      const category = document.getElementById("edit-category").value;
      const timeInVal = document.getElementById("edit-timein").value;
      const timeOutVal = document.getElementById("edit-timeout").value;
      if (!label || !url) { status.textContent = "Label and URL are required."; return; }
      const updates = { label, url, category };
      updates.timeIn = timeInVal !== "" ? parseFloat(timeInVal) : null;
      updates.timeOut = timeOutVal !== "" ? parseFloat(timeOutVal) : null;
      await updateDoc(doc(db, "sounds", editingId), updates);
      const idx = allDocs.findIndex(s => s.id === editingId);
      if (idx !== -1) allDocs[idx] = { ...allDocs[idx], ...updates };
      status.textContent = "Saved!";
      setTimeout(() => {
        closeEdit();
        // re-render all buttons
        ["themes","tv","reactions","sfx","quotes"].forEach(cat => {
          const el = document.getElementById(cat);
          el.innerHTML = "";
          allDocs.filter(s => s.category === cat).forEach((s, i) => renderButton(s, i, el));
        });
        openManage();
      }, 600);
    };

    // --- Admin: triple-click revision tag to open manage ---
    let revClicks = 0, revTimer;
    document.getElementById("rev-tag").onclick = () => {
      revClicks++;
      clearTimeout(revTimer);
      revTimer = setTimeout(() => revClicks = 0, 600);
      if (revClicks >= 3) { revClicks = 0; openManage(); }
    };
  </script>
</body>
</html>
